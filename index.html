<style>

<body>
<header><div class="row" id="hdr"><h1>Prenotazioni servizio</h1></div></header>
<main id="app"><div class="card center muted">Caricamento…</div></main>
<div id="toast"></div>
<div class="spin" id="spin"><div></div></div>
<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<script>
'use strict';
/* =====================================================================
   Visita del sorvegliante – prenotazioni delle uscite in servizio
   App statica per GitHub Pages. I dati stanno in dati.json nello stesso
   repository, CIFRATI con la password della congregazione (AES-GCM,
   chiave da PBKDF2), come l'app "Gruppi di servizio". Anche il token
   GitHub che serve per salvare è cifrato nello stesso file.
   ===================================================================== */
const SLOTS=[['M','Mattina'],['P','Pomeriggio']];
const MOTIVI=[['campo','Servizio di campo'],['ulteriori','Visite ulteriori'],['studi','Studi biblici']];
const FORMATO='visita-sorvegliante-cifrato', ITER=310000;
const GRUPPI_URL_DEFAULT='https://lucioros.github.io/gruppiservizio/dati.json';
const LS_PW='cov_pw', LS_SES='cov_ses', LS_DEMO='cov_demo_file', LS_DEMOFLAG='cov_demo';
const POLL_MS=45000;

/* repository: ricavato dall'indirizzo del sito (utente.github.io/repository) */
function ghConf(){
  const c={owner:'',repo:'',branch:'main',path:'dati.json'};
  if(window.COV_CONFIG) Object.assign(c,window.COV_CONFIG);
  if(!c.owner && location.hostname.endsWith('.github.io')){
    c.owner=location.hostname.split('.')[0];
    c.repo=location.pathname.split('/').filter(Boolean)[0] || (c.owner+'.github.io');
  }
  return c;
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));}catch{}}

const S={gh:ghConf(), demo:lsGet(LS_DEMOFLAG)===true, key:null, file:null, sha:null, etag:null, token:null,
  data:null, user:null, ses:lsGet(LS_SES), view:'home', tab:'giorni', draftDays:null, sheet:null, imp:null,
  histOpen:null, histUser:'', busy:false, polling:false};

/* ---------- utilità ---------- */
function toast(m,k){const t=$('#toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='',3500);}
function spin(on){$('#spin').classList.toggle('show',!!on);}
const te=new TextEncoder(), td=new TextDecoder();
const toB64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);};
const fromB64=b=>Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0));
const b64url=s=>toB64(te.encode(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64url=s=>td.decode(fromB64(s.replace(/-/g,'+').replace(/_/g,'/')));
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encObj(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return{iv:toB64(iv),ct:toB64(new Uint8Array(ct))};}
async function decObj(key,e){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(e.iv)},key,fromB64(e.ct));return JSON.parse(td.decode(pt));}
async function sha256(s){const h=await crypto.subtle.digest('SHA-256',te.encode(s));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const pinHash=(id,pin)=>sha256('cov|'+id+'|'+pin);
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function ymd(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
const todayStr=()=>ymd(new Date());
const fmtDay=(s,o)=>{const t=parseDate(s).toLocaleDateString('it-IT',o||{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1);};
const fmtShort=s=>parseDate(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const slotName=k=>(SLOTS.find(x=>x[0]===k)||[,k])[1];
const motivoName=k=>(MOTIVI.find(x=>x[0]===k)||[,k])[1];
const byName=(a,b)=>a.name.localeCompare(b.name,'it',{sensitivity:'base'});

/* ---------- dati ---------- */
const PERS=['S','M']; // S = sorvegliante, M = moglie del sorvegliante
const EVENTI=[['pionieri','Adunanza con i pionieri regolari',['S','M']],['anziani','Adunanza con anziani e servitori di ministero',['S']],['libera','Mezza giornata libera',['S','M']],['altro','Altro evento',['S']]];
const QUANDO=[['M','Mattina'],['P','Pomeriggio'],['G','Tutto il giorno'],['E','Sera']];
const quandoName=k=>(QUANDO.find(x=>x[0]===k)||[,k])[1];
const evTitle=e=>e.titolo||(EVENTI.find(x=>x[0]===e.tipo)||[,'Evento'])[1];
function normalize(d){
  d=d||{}; d.v=2;
  d.settings=Object.assign({titolo:'Visita del sorvegliante di circoscrizione',congregazione:'',capDefault:2,capMoglie:2,maxPerUser:1,mostraNomi:true,gruppiUrl:GRUPPI_URL_DEFAULT},d.settings||{});
  d.users=Array.isArray(d.users)?d.users:[];
  d.visite=Array.isArray(d.visite)?d.visite:[];
  const cs=d.settings.capDefault, cm=d.settings.capMoglie;
  d.visite.forEach(v=>{
    v.days=v.days||[]; v.bookings=v.bookings||[]; v.eventi=v.eventi||[];
    if(v.aperto===undefined)v.aperto=true;
    if(v.conMoglie===undefined)v.conMoglie=!!v.moglie;
    v.days.forEach(day=>{day.slots=day.slots||{};SLOTS.forEach(([k])=>{
      let s=day.slots[k];
      if(!s){day.slots[k]={orario:'',luogo:'',S:{on:false,cap:cs},M:{on:false,cap:cm}};return;}
      if(!s.S){ // formato della prima versione
        if(!s.on&&s.motivo&&!v.eventi.some(e=>e.date===day.date&&e.quando===k))v.eventi.push({id:'m'+day.date+k,date:day.date,quando:k,tipo:'altro',titolo:s.motivo,chi:['S','M']});
        s.S={on:!!s.on||!!s.motivo,cap:s.cap??cs}; s.M={on:false,cap:cm}; delete s.on; delete s.cap; delete s.motivo;
      }
      if(!s.M)s.M={on:false,cap:cm};
    });});
    v.bookings.forEach(b=>{if(!b.con)b.con='S';});
  });
  if(!d.visite.some(v=>v.id===d.attiva)) d.attiva=d.visite.length?d.visite[d.visite.length-1].id:null;
  return d;
}
const V=d=>(d||S.data).visite.find(v=>v.id===(d||S.data).attiva)||null;
const sortedDays=v=>[...(v?.days||[])].sort((a,b)=>a.date.localeCompare(b.date));
const slotBookings=(v,date,k,p)=>v.bookings.filter(b=>b.date===date&&b.slot===k&&(!p||b.con===p));
const userBookings=(v,id)=>v?v.bookings.filter(b=>b.userId===id):[];
const persCap=(d,s,p)=>Math.max(1,Number(s?.[p]?.cap??(p==='M'?d.settings.capMoglie:d.settings.capDefault))||1);
const userName=(d,b)=>d.users.find(u=>u.id===b.userId)?.name||b.userName||'(non più in elenco)';
const userTel=(d,b)=>b.tel||d.users.find(u=>u.id===b.userId)?.tel||'';
const persList=v=>v.conMoglie?PERS:['S'];
const blockingEvent=(v,date,k,p)=>v.eventi.find(e=>e.date===date&&(e.quando===k||e.quando==='G')&&(e.chi||[]).includes(p));
function persOn(v,day,k,p){const s=day?.slots?.[k];if(!s||!s[p]?.on)return false;return p==='S'||!!v.conMoglie;}
const available=(v,day,k,p)=>persOn(v,day,k,p)&&!blockingEvent(v,day.date,k,p);
const conLabel=(v,p)=>p==='M'?`Con la moglie del sorvegliante${v.moglie?' ('+v.moglie+')':''}`:`Con il sorvegliante${v.sorvegliante?' ('+v.sorvegliante+')':''}`;
const conShort=p=>p==='M'?'moglie del sorvegliante':'sorvegliante';
const chiText=e=>{const c=e.chi||[];return c.length===2?'Sorvegliante e moglie':c[0]==='M'?'Moglie del sorvegliante':c[0]==='S'?'Sorvegliante':'';};
function validKeys(v){const set=new Set();v.days.forEach(day=>SLOTS.forEach(([k])=>PERS.forEach(p=>{if(available(v,day,k,p))set.add(day.date+'|'+k+'|'+p);})));return set;}
const bKey=b=>b.date+'|'+b.slot+'|'+(b.con||'S');
const telOk=t=>String(t||'').replace(/\D/g,'').length>=6;
function visitRange(v){const ds=sortedDays(v);if(!ds.length)return'nessun giorno';const a=ds[0].date,b=ds[ds.length-1].date;return a===b?fmtShort(a):fmtShort(a)+' – '+fmtShort(b);}

/* ---------- archivio (GitHub o demo locale) ---------- */
const apiUrl=()=>`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}/contents/${S.gh.path}`;
function ghH(extra){return Object.assign({Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+S.token},extra||{});}
async function httpErr(r){let m='';try{m=(await r.json()).message||'';}catch{}
  const e=new Error(r.status===401?'Il token di GitHub non è valido o è scaduto: l\'amministratore deve aggiornarlo in Gestione → Impostazioni.':
    r.status===403?'GitHub ha rifiutato la richiesta (permessi o troppe richieste). Riprova tra poco.':
    r.status===404?'Repository o file non trovato su GitHub.':'Errore GitHub '+r.status+(m?': '+m:''));e.status=r.status;return e;}
async function fetchFile(){
  if(S.demo){const f=lsGet(LS_DEMO);return f?{file:f.file,sha:String(f.v)}:null;}
  if(S.token){
    const h=ghH(); if(S.etag&&S.file)h['If-None-Match']=S.etag;
    const r=await fetch(apiUrl()+'?ref='+S.gh.branch,{headers:h,cache:'no-store'});
    if(r.status===304)return{file:S.file,sha:S.sha,same:true};
    if(r.status===404)return null;
    if(!r.ok)throw await httpErr(r);
    const j=await r.json(); S.etag=r.headers.get('ETag');
    return{file:JSON.parse(td.decode(fromB64(j.content))),sha:j.sha};
  }
  const r=await fetch(S.gh.path+'?t='+Date.now(),{cache:'no-store'});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('Sito non raggiungibile ('+r.status+')');
  return{file:await r.json(),sha:null};
}
async function putFile(file,sha,msg,token){
  if(S.demo){const cur=lsGet(LS_DEMO);if(cur&&sha!==String(cur.v)){const e=new Error('conflict');e.status=409;throw e;}
    const v=(cur?cur.v:0)+1;lsSet(LS_DEMO,{v,file});return String(v);}
  const t=token||S.token;
  const body={message:msg,branch:S.gh.branch,content:toB64(te.encode(JSON.stringify(file)))};if(sha)body.sha=sha;
  const r=await fetch(apiUrl(),{method:'PUT',headers:Object.assign(ghH({'Content-Type':'application/json'}),{Authorization:'Bearer '+t}),body:JSON.stringify(body)});
  if(!r.ok)throw await httpErr(r);
  const j=await r.json(); S.etag=null; return j.content.sha;
}
function passwordChanged(){ // un altro ha cambiato la password: bisogna rientrare
  lsSet(LS_PW,null); S.key=null; S.data=null; S.user=null; renderUnlock('La password della congregazione è stata cambiata. Inserisci quella nuova.');
}
/* modifica sicura: rilegge, applica, salva; se due salvano insieme si riprova */
async function mutate(msg,fn){
  if(S.busy)return false;
  if(!S.token&&!S.demo){toast('Il salvataggio non è attivo: avvisa l\'amministratore.','err');return false;}
  S.busy=true; spin(true);
  try{
    for(let i=0;i<6;i++){
      const rem=await fetchFile(); if(!rem)throw new Error('Archivio non trovato');
      if(rem.file.kdf.salt!==S.file.kdf.salt){passwordChanged();return false;}
      const base=rem.same?S.data:normalize(await decObj(S.key,rem.file.dati));
      S.data=base; S.file=rem.file; S.sha=rem.sha;
      const d=structuredClone(base), res=fn(d);
      if(typeof res==='string'){toast(res,'err');return false;}
      normalize(d);
      const file=Object.assign({},rem.file,{dati:await encObj(S.key,d),aggiornato:new Date().toISOString()});
      try{S.sha=await putFile(file,rem.sha,msg);S.file=file;S.data=d;return true;}
      catch(e){if(e.status===409||e.status===422){S.etag=null;await sleep(400+Math.random()*800*(i+1));continue;}throw e;}
    }
    throw new Error('Salvataggio non riuscito, riprova.');
  }catch(e){toast(e.message,'err');return false;}
  finally{S.busy=false;spin(false);if(S.data){resolveUser();render();}}
}
async function refresh(silent){
  if(S.busy||!S.key)return;
  try{
    const rem=await fetchFile(); if(!rem||rem.same)return;
    if(rem.file.kdf.salt!==S.file.kdf.salt)return passwordChanged();
    S.data=normalize(await decObj(S.key,rem.file.dati)); S.file=rem.file; S.sha=rem.sha;
    if(rem.file.token){try{S.token=await decObj(S.key,rem.file.token);}catch{}}
    resolveUser(); if(!isEditing())render();
    if(!silent)toast('Aggiornato');
  }catch(e){if(!silent)toast(e.message,'err');}
}
function isEditing(){const a=document.activeElement;return S.sheet||S.draftDays||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#app'));}

/* ---------- avvio ---------- */
async function boot(){
  const m=location.hash.match(/[#&]p=([^&]+)/);
  if(m){try{lsSet(LS_PW,unb64url(m[1]));}catch{} history.replaceState(null,'',location.pathname+location.search);}
  if(!S.demo&&!S.gh.owner){header();return renderNoRepo();}
  spin(true);
  let rem; try{rem=await fetchFile();}catch(e){spin(false);header();return renderError(e.message);}
  spin(false);
  if(!rem){header();return renderInit();}
  S.file=rem.file; S.sha=rem.sha;
  const pw=lsGet(LS_PW);
  if(pw){ if(await unlock(pw,true)) return; }
  renderUnlock();
}
async function unlock(pw,quiet){
  spin(true);
  try{
    const f=S.file; const key=await deriveKey(pw,fromB64(f.kdf.salt),f.kdf.iter);
    let data; try{data=await decObj(key,f.dati);}catch{ if(!quiet)toast('Password errata','err'); lsSet(LS_PW,null); return false; }
    S.key=key; S.data=normalize(data);
    if(f.token){try{S.token=await decObj(key,f.token);}catch{S.token=null;}}
    if(S.token&&!S.demo){ try{const fr=await fetchFile(); if(fr){ if(fr.file.kdf.salt!==f.kdf.salt){S.token=null;} else {S.file=fr.file;S.sha=fr.sha;S.data=normalize(await decObj(key,fr.file.dati));}}}catch(e){toast(e.message,'err');} }
    lsSet(LS_PW,pw);
    resolveUser(); render(); startPolling(); return true;
  }finally{spin(false);}
}
function startPolling(){
  if(S.polling)return; S.polling=true;
  setInterval(()=>{if(document.visibilityState==='visible')refresh(true);},POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh(true);});
}
function resolveUser(){
  const u=S.data&&S.ses?S.data.users.find(x=>x.id===S.ses.id):null;
  S.user=(u&&u.pin&&u.pin===S.ses.pin)?u:null;
  if(!S.user||!S.user.admin){if(S.view==='admin')S.view='home';}
}

async function doInit(){
  const pw=$('#i_pw').value,name=$('#i_name').value.trim(),pin=$('#i_pin').value,tok=S.demo?null:$('#i_tok').value.trim();
  if(pw.length<8)return toast('La password deve avere almeno 8 caratteri','err');

  if(!name)return toast('Inserisci il tuo nome','err');
  if(!/^\d{4,6}$/.test(pin))return toast('Il PIN deve avere da 4 a 6 cifre','err');
  if(pin!==$('#i_pin2').value)return toast('I due PIN non coincidono','err');
  if(!S.demo&&!tok)return toast('Inserisci il token GitHub','err');
  spin(true);
  try{
    if(!S.demo){const r=await fetch(`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}`,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tok}});
      if(!r.ok)throw new Error('Token non valido o senza accesso al repository ('+r.status+')');}
    const id=uid(), vid=uid();

    const salt=crypto.getRandomValues(new Uint8Array(16)), key=await deriveKey(pw,salt,ITER);
    const file={formato:FORMATO,v:1,kdf:{salt:toB64(salt),iter:ITER},dati:await encObj(key,data),token:tok?await encObj(key,tok):null,aggiornato:new Date().toISOString()};
    S.token=tok; S.sha=await putFile(file,null,'Visita sorvegliante: creato archivio',tok);
    S.file=file; S.key=key; S.data=data; lsSet(LS_PW,pw);
    S.ses={id,pin:data.users[0].pin}; lsSet(LS_SES,S.ses); S.view='admin'; S.tab='giorni';

/* ---------- regole di prenotazione ---------- */
function canBook(d,userId,date,k,p,asAdmin){
  const v=V(d); if(!v)return'Nessuna visita attiva';
  const day=v.days.find(x=>x.date===date);
  if(!persOn(v,day,k,p))return'Questa mezza giornata non è disponibile';
  const ev=blockingEvent(v,date,k,p); if(ev)return'Non disponibile: '+evTitle(ev);
  if(!asAdmin){if(!v.aperto)return'Le prenotazioni sono chiuse';if(date<todayStr())return'Questo giorno è già passato';}
  if(slotBookings(v,date,k).some(b=>b.userId===userId))return'Hai già una prenotazione in questa mezza giornata';
  if(slotBookings(v,date,k,p).length>=persCap(d,day.slots[k],p))return'Posti esauriti: qualcuno ha appena prenotato';
  const max=Number(d.settings.maxPerUser)||0;
  if(!asAdmin&&max>0&&userBookings(v,userId).length>=max)return max===1?'Puoi prenotare una sola uscita':`Puoi prenotare al massimo ${max} uscite`;
  return null;
}
async function unbook(id){
  const v=V(), b=v.bookings.find(x=>x.id===id); if(!b)return;
  const mine=b.userId===S.user.id; if(!mine&&!S.user.admin)return;
  const nm=userName(S.data,b), q=`${fmtDay(b.date)} (${slotName(b.slot).toLowerCase()}, con ${b.con==='M'?'la moglie':'il sorvegliante'})`;
  if(!confirm(mine?`Annullare la tua prenotazione di ${q}?`:`Rimuovere ${nm} da ${q}?`))return;
  if(await mutate(`Annullata ${b.date} ${slotName(b.slot)}: ${nm}`,d=>{
    const vv=V(d),i=vv.bookings.findIndex(x=>x.id===id); if(i<0)return'Prenotazione già annullata';
    if(!S.user.admin&&!vv.aperto)return'Le prenotazioni sono chiuse: contatta l\'amministratore';
    vv.bookings.splice(i,1);
  })){closeSheet();toast('Prenotazione annullata');}
}

/* ---------- modulo di prenotazione (con chi, motivo, studi biblici, telefono) ---------- */
function openBook(date,k,p,userId){

function shMot(k,on){const m=S.sheet.motivi;if(on&&!m.includes(k))m.push(k);if(!on)S.sheet.motivi=m.filter(x=>x!==k);
  S.sheet.motivi.sort((a,b)=>MOTIVI.findIndex(x=>x[0]===a)-MOTIVI.findIndex(x=>x[0]===b));renderSheet();}
function shAddStudio(){S.sheet.studi.push({pub:'',lez:'',par:''});renderSheet();}

async function shSave(){
  const sh=S.sheet;
  const tel=String(sh.tel||'').trim();
  if(!telOk(tel))return toast('Inserisci un numero di telefono valido','err');
  if(!sh.motivi.length)return toast('Scegli almeno un motivo','err');
  let studi=[];
  if(sh.motivi.includes('studi')){
    studi=sh.studi.map(s=>({pub:s.pub.trim(),lez:String(s.lez).trim(),par:String(s.par).trim()})).filter(s=>s.pub||s.lez||s.par);
    if(!studi.length)return toast('Indica la pubblicazione dello studio biblico','err');
    if(studi.some(s=>!s.pub))return toast('Indica la pubblicazione per ogni studio','err');
  }
  const det={motivi:[...sh.motivi],studi,note:sh.note.trim(),tel};
  const who=S.data.users.find(u=>u.id===sh.userId)?.name||'';
  const asAdmin=sh.userId!==S.user.id&&S.user.admin;
  let ok;
  if(sh.mode==='new'){
    ok=await mutate(`Prenotazione ${sh.date} ${slotName(sh.k)} con ${conShort(sh.p)}: ${who}`,d=>{
      const e=canBook(d,sh.userId,sh.date,sh.k,sh.p,asAdmin); if(e)return e;
      V(d).bookings.push(Object.assign({id:uid(),date:sh.date,slot:sh.k,con:sh.p,userId:sh.userId,userName:who,at:new Date().toISOString(),by:S.user.id},det));
      const u=d.users.find(x=>x.id===sh.userId); if(u)u.tel=tel;
    });
  }else{
    ok=await mutate(`Modificata prenotazione ${sh.date} ${slotName(sh.k)}: ${who}`,d=>{
      const b=V(d).bookings.find(x=>x.id===sh.id); if(!b)return'Prenotazione non trovata';
      if(b.userId!==S.user.id&&!S.user.admin)return'Operazione non consentita';
      Object.assign(b,det,{mod:new Date().toISOString()});
      const u=d.users.find(x=>x.id===b.userId); if(u)u.tel=tel;
    });
  }
  if(ok){closeSheet();toast(sh.mode==='new'?'Prenotazione confermata ✓':'Modifiche salvate ✓');}
  else if(sh.mode==='new'&&S.data&&canBook(S.data,sh.userId,sh.date,sh.k,sh.p,asAdmin))closeSheet();
}

  const p=[(b.motivi||[]).map(motivoName).join(', ')];

/* ---------- pagina delle prenotazioni (quella che vedono i fratelli) ---------- */
function renderHome(){

  }else h+=`<p>Non hai ancora prenotato. Scegli qui sotto una mezza giornata libera.</p>`;
  if(max>0)h+=`<p class="muted">${max===1?'Ognuno può prenotare una sola uscita.':`Ognuno può prenotare fino a ${max} uscite.`}</p>`;

    h+=`<div class="card"${past?' style="opacity:.6"':''}><h3>${esc(fmtDay(day.date))}</h3>`;
    v.eventi.filter(e=>e.date===day.date&&e.quando==='G').forEach(e=>h+=eventHtml(e));
    for(const[k,label]of SLOTS){
      const s=day.slots?.[k]; if(!s)continue;
      const evs=v.eventi.filter(e=>e.date===day.date&&e.quando===k);
      const ps=persList(v).map(p=>({p,on:persOn(v,day,k,p),ev:blockingEvent(v,day.date,k,p)}));
      if(!ps.some(x=>x.on&&!x.ev)){
        h+=`<div class="slot off"><div class="top"><span class="name">${label}</span><span class="pill off">Nessun appuntamento</span></div>${evs.map(eventHtml).join('')}</div>`;continue;}
      const isMine=slotBookings(v,day.date,k).some(b=>b.userId===me.id);
      h+=`<div class="slot${isMine?' mine':''}"><div class="top"><span class="name">${label}${s.orario?' · '+esc(s.orario):''}</span></div>`;
      if(s.luogo)h+=`<p class="muted">📍 ${esc(s.luogo)}</p>`;
      if(s.info)h+=`<p class="muted">${esc(s.info)}</p>`;
      h+=evs.map(eventHtml).join('');
      for(const x of ps){
        if(!x.on||x.ev){ if(v.conMoglie)h+=`<p class="muted" style="margin-top:10px">${esc(conLabel(v,x.p))}: ${x.ev?'impegnato · '+esc(evTitle(x.ev)):'nessun appuntamento'}</p>`; continue; }
        const list=slotBookings(v,day.date,k,x.p),cap=persCap(d,s,x.p),free=cap-list.length;
        h+=`<div class="pblock"><div class="top"><b style="font-size:15px">${esc(conLabel(v,x.p))}</b>${free<=0?'<span class="pill full">Completo</span>':`<span class="pill free">${free===1?'1 libero':free+' liberi'}</span>`}</div>`;
        const show=st.mostraNomi||adm;
        if(list.length){
          h+=`<ul class="who">${list.map(b=>{const mineB=b.userId===me.id;
            if(!show&&!mineB)return'';
            return `<li style="align-items:flex-start"><span>${mineB?'<b>Tu</b>':esc(userName(d,b))}${(mineB||adm)?'<br>'+detailHtml(b,adm):''}</span>
            ${(mineB||adm)?`<button class="btn sm sec" onclick="openEdit('${b.id}')">${mineB?'Modifica':'Dettagli'}</button>`:''}</li>`;}).join('')}</ul>`;
          if(!show)h+=`<p class="muted">${list.length} su ${cap} prenotati</p>`;
        }
        h+=`<div class="actions">`;
        if(!isMine&&!past&&free>0&&v.aperto){const e=canBook(d,me.id,day.date,k,x.p,false);
          h+=e?(/prenotare/.test(e)?'':`<span class="muted">${esc(e)}</span>`):`<button class="btn sm ok" onclick="openBook('${day.date}','${k}','${x.p}')">Prenota</button>`;}
        if(adm&&free>0){const busy=new Set(slotBookings(v,day.date,k).map(b=>b.userId));const av=people.filter(u=>!busy.has(u.id)&&u.id!==me.id);
          if(av.length)h+=`<select style="flex:1;min-width:150px;padding:7px" onchange="if(this.value)openBook('${day.date}','${k}','${x.p}',this.value);this.value=''"><option value="">+ Prenota per…</option>${av.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>`;}
        h+=`</div></div>`;
      }
      h+=`</div>`;
    }
    v.eventi.filter(e=>e.date===day.date&&e.quando==='E').forEach(e=>h+=eventHtml(e));
    h+=`</div>`;
  }
  $('#app').innerHTML=h;
}

function draft(){if(!S.draftDays)S.draftDays=structuredClone(sortedDays(V()));return S.draftDays;}
function dd(i,k,f,val){
  const clean=!S.draftDays, days=draft(); const s=days[i].slots[k]=days[i].slots[k]||{};
  const parts=f.split('.'); let o=s; if(parts.length===2){o=s[parts[0]]=s[parts[0]]||{};}
  o[parts[parts.length-1]]=val;
  if(f.endsWith('.on')){const p=parts[0];if(val&&o.cap==null)o.cap=p==='S'?S.data.settings.capDefault:S.data.settings.capMoglie;return render();}
  if(clean){let pos=null;try{pos=document.activeElement.selectionStart;}catch{}render();
    const el=document.querySelector(`[oninput^="dd(${i},'${k}','${f}'"]`);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch{}}}
}
function addDays(){
  const f=$('#g_from').value,t=$('#g_to').value||f,noMon=$('#g_nomon').checked;
  if(!f)return toast('Scegli la data iniziale','err'); if(t<f)return toast('La data finale è prima di quella iniziale','err');
  const days=draft(),st=S.data.settings,cm=!!V().conMoglie,om=$('#g_om').value.trim(),op=$('#g_op').value.trim();let n=0;
  const mk=or=>({orario:or,luogo:'',S:{on:true,cap:st.capDefault},M:{on:cm,cap:st.capMoglie}});
  for(let dt=parseDate(f);ymd(dt)<=t&&n<31;dt.setDate(dt.getDate()+1)){const s=ymd(dt);
    if(noMon&&dt.getDay()===1)continue; if(days.some(x=>x.date===s))continue;
    days.push({date:s,slots:{M:mk(om),P:mk(op)}});n++;}
  days.sort((a,b)=>a.date.localeCompare(b.date)); render();
  toast(n?`Aggiunti ${n} giorni: controlla e premi “Salva giorni”`:'Nessun nuovo giorno da aggiungere');
}
function delDay(i){const days=draft(),n=V().bookings.filter(b=>b.date===days[i].date).length;
  if(n&&!confirm(`Questo giorno ha ${n} prenotazioni, che verranno cancellate al salvataggio. Continuare?`))return; days.splice(i,1); render();}
async function saveDays(){
  const days=structuredClone(S.draftDays||sortedDays(V()));
  days.forEach(day=>SLOTS.forEach(([k])=>PERS.forEach(p=>{const ps=day.slots[k]?.[p];if(ps&&ps.on)ps.cap=Math.max(1,Math.min(20,parseInt(ps.cap)||1));})));
  const cur=V(), valid=validKeys(Object.assign({},cur,{days}));
  const lost=cur.bookings.filter(b=>!valid.has(bKey(b)));
  if(lost.length&&!confirm(`${lost.length} prenotazioni riguardano mezze giornate non più disponibili e verranno cancellate. Continuare?`))return;
  const vid=S.data.attiva;
  if(await mutate('Aggiornati i giorni della visita',d=>{const v=d.visite.find(x=>x.id===vid);if(!v)return'Visita non trovata';v.days=days;const ok=validKeys(v);v.bookings=v.bookings.filter(b=>ok.has(bKey(b)));})){S.draftDays=null;render();toast('Giorni salvati ✓');}
}

function evTipo(t){const f=S.evForm,v=V();f.tipo=t;const def=(EVENTI.find(x=>x[0]===t)||[,,['S']])[2];f.chi=def.filter(p=>p==='S'||v.conMoglie);if(t==='libera'&&f.quando==='E')f.quando='M';render();}
function evChi(p,on){const f=S.evForm;f.chi=f.chi.filter(x=>x!==p);if(on)f.chi.push(p);f.chi.sort();f.chi.reverse();}
function editEvent(id){const e=V().eventi.find(x=>x.id===id);if(!e)return;S.evForm=Object.assign(structuredClone(e),{editId:id,titolo:e.titolo||'',orario:e.orario||'',luogo:e.luogo||'',note:e.note||''});render();scrollTo(0,0);}
async function saveEvent(){

/* --- Telefoni da un file esportato da Hourglass (letto solo sul dispositivo) --- */
const normName=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function hgKeys(f,m,l){const k=new Set();[[l,f],[f,l],[l,f,m],[f,m,l],[l,m,f]].forEach(a=>{const x=normName(a.filter(Boolean).join(' '));if(x)k.add(x);});return k;}
function userKeys(u){const k=new Set([normName(u.name)]);if(u.cognome||u.nome){k.add(normName(u.cognome+' '+u.nome));k.add(normName(u.nome+' '+u.cognome));}
  const w=normName(u.name).split(' ');if(w.length===2)k.add(w[1]+' '+w[0]);return k;}
async function hgFile(file){
  if(!file)return;
  try{
    const j=JSON.parse(await file.text());
    const ppl=[...(j.publishers||[]),...(j.notPublishers||[])];
    if(!ppl.length)throw new Error('Il file non sembra un export di Hourglass');
    const idx=new Map(), dup=new Set();
    ppl.forEach(p=>{const tel=String(p.cellphone||p.homephone||p.otherphone||'').trim();if(!tel)return;
      hgKeys(p.firstname,p.middlename,p.lastname).forEach(k=>{if(idx.has(k)&&idx.get(k)!==tel)dup.add(k);idx.set(k,tel);});});
    const matches=[],missing=[];
    [...S.data.users].sort(byName).forEach(u=>{let tel=null;for(const k of userKeys(u))if(idx.has(k)&&!dup.has(k)){tel=idx.get(k);break;}
      if(tel)matches.push({id:u.id,name:u.name,tel,old:u.tel||''});else if(!u.tel)missing.push(u.name);});
    S.hg={matches,missing,over:false};
  }catch(e){toast(e.message==='Unexpected token'?'File non valido':e.message,'err');S.hg=null;}
  render();
}
async function hgApply(){
  const pick=S.hg.matches.filter(m=>m.old!==m.tel&&(S.hg.over||!m.old));
  if(!pick.length)return toast('Nessun numero da aggiornare','err');
  if(await mutate(`Telefoni da Hourglass (${pick.length})`,d=>{pick.forEach(m=>{const u=d.users.find(x=>x.id===m.id);if(u)u.tel=m.tel;});}))
    {S.hg=null;render();toast(`Aggiornati ${pick.length} numeri ✓`);}
}
function hgCard(){
  const hg=S.hg;
  let h=`<div class="card"><h2>Telefoni da Hourglass</h2>`;
  if(!hg)return h+`<p class="muted">Scegli il file .json esportato da Hourglass: l'app prende solo nome, cognome e numero di telefono. Il file viene letto su questo dispositivo e non viene caricato da nessuna parte.</p>
    <input type="file" accept=".json,application/json" onchange="hgFile(this.files[0])"></div>`;
  const nNew=hg.matches.filter(m=>!m.old).length, nDiff=hg.matches.filter(m=>m.old&&m.old!==m.tel).length, n=hg.matches.filter(m=>m.old!==m.tel&&(hg.over||!m.old)).length;
  h+=`<p><b>${hg.matches.length}</b> nomi trovati in Hourglass: <b>${nNew}</b> numeri nuovi${nDiff?`, <b>${nDiff}</b> diversi da quelli già salvati`:''}.</p>
    ${nDiff?`<label class="chk"><input type="checkbox" ${hg.over?'checked':''} onchange="S.hg.over=this.checked;render()"> Sostituisci anche i numeri già presenti</label>`:''}
    <div class="list" style="max-height:260px;overflow:auto;margin-top:8px">${hg.matches.map(m=>`<div class="it" style="padding:6px 0"><div class="grow">${esc(m.name)}<br><span class="muted">${esc(m.tel)}${m.old&&m.old!==m.tel?' (ora: '+esc(m.old)+')':m.old===m.tel?' (già uguale)':''}</span></div></div>`).join('')}</div>
    ${hg.missing.length?`<p class="muted" style="margin-top:10px">Senza numero e non trovati in Hourglass (${hg.missing.length}): ${hg.missing.map(esc).join(', ')}</p>`:''}
    <button class="btn full" ${n?'':'disabled'} onclick="hgApply()">Salva ${n} numeri</button><button class="btn sec full" onclick="S.hg=null;render()">Annulla</button></div>`;
  return h;
}
function impStart(){S.imp={step:'pw'};render();const pw=lsGet(LS_PW);if(pw)impLoad(pw,true);else setTimeout(()=>$('#imp_pw')?.focus(),50);}
async function impLoad(pw,quiet){
  if(!pw)return; spin(true);
  try{
    const url=S.data.settings.gruppiUrl||GRUPPI_URL_DEFAULT;
    const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Non riesco ad aprire l\'app Gruppi di servizio ('+r.status+'). Controlla l\'indirizzo in Impostazioni.');
    const f=await r.json(); const key=await deriveKey(pw,fromB64(f.kdf.salt),f.kdf.iter);
    let g; try{g=await decObj(key,f.dati);}catch{S.imp={step:'pw',err:quiet?'Inserisci la password dell\'app Gruppi di servizio.':'Password errata.'};return;}
    const ord=g.ordine||'cn', gname=id=>{const i=(g.gruppi||[]).findIndex(x=>x.id===id);return i<0?'Senza gruppo':((g.gruppi[i].nome)||('Gruppo '+(i+1)));};
    const have=S.data.users;
    const list=(g.persone||[]).map(p=>{const label=(ord==='nc'?[p.nome,p.cognome]:[p.cognome,p.nome]).filter(Boolean).join(' ').trim();
      return{gsId:p.id,nome:p.nome||'',cognome:p.cognome||'',label,gruppo:gname(p.gruppo),inatt:!!p.inatt,
        already:have.some(u=>u.gsId===p.id||u.name.toLowerCase()===label.toLowerCase())};}).filter(p=>p.label)
      .sort((a,b)=>a.label.localeCompare(b.label,'it',{sensitivity:'base'}));
    const order=[...(g.gruppi||[]).map((x,i)=>x.nome||('Gruppo '+(i+1))),'Senza gruppo'];
    list.sort((a,b)=>order.indexOf(a.gruppo)-order.indexOf(b.gruppo));
    S.imp={step:'list',list,inatt:false,sel:new Set(list.filter(p=>!p.inatt&&!p.already).map(p=>p.gsId))};
  }catch(e){S.imp={step:'pw',err:e.message};}
  finally{spin(false);render();}
}

/* --- Riepilogo della visita attiva (programma per il sorvegliante) --- */
function visitText(d,v,withDetails){
  const evLine=e=>`🗓 ${evTitle(e)}${e.orario?' ore '+e.orario:''}${e.luogo?' – '+e.luogo:''} (${chiText(e)})${e.note?' – '+e.note:''}`;
  let t=`*${v.nome||d.settings.titolo}*${d.settings.congregazione?'\n'+d.settings.congregazione:''}`;
  if(v.sorvegliante)t+=`\nSorvegliante: ${v.sorvegliante}${withDetails&&v.telSorv?' – '+v.telSorv:''}`;
  if(v.conMoglie&&v.moglie)t+=`\nMoglie: ${v.moglie}${withDetails&&v.telMoglie?' – '+v.telMoglie:''}`;
  t+='\n';
  for(const day of sortedDays(v)){
    t+=`\n*${fmtDay(day.date)}*\n`;
    v.eventi.filter(e=>e.date===day.date&&e.quando==='G').forEach(e=>t+=evLine(e)+' – tutto il giorno\n');
    for(const[k,label]of SLOTS){const s=day.slots[k];if(!s)continue;
      const evs=v.eventi.filter(e=>e.date===day.date&&e.quando===k);
      const ps=persList(v).filter(p=>available(v,day,k,p));
      t+=`${label}${s.orario&&ps.length?' ore '+s.orario:''}${s.luogo&&ps.length?' – '+s.luogo:''}${ps.length||evs.length?'':': nessun appuntamento'}\n`;
      evs.forEach(e=>t+='  '+evLine(e)+'\n');
      for(const p of ps){const list=slotBookings(v,day.date,k,p),cap=persCap(d,s,p),fr=cap-list.length;
        t+=`  ${v.conMoglie?conLabel(v,p):'Appuntamenti'}${fr>0?` [${fr===1?'1 posto libero':fr+' posti liberi'}]`:''}:\n`;
        list.forEach(b=>{const tel=withDetails?userTel(d,b):'';t+=`    • ${userName(d,b)}${tel?' ('+tel+')':''}${withDetails&&detailText(b)?' – '+detailText(b):''}\n`;});
        if(!list.length)t+='    • nessuno\n';}
    }
    v.eventi.filter(e=>e.date===day.date&&e.quando==='E').forEach(e=>t+='Sera: '+evLine(e)+'\n');
  }
  return t;
}

/* --- PDF degli appuntamenti: una pagina, un riquadro per il sorvegliante e uno per la moglie --- */
function loadJsPdf(){
  if(window.jspdf)return Promise.resolve();
  return new Promise((ok,ko)=>{const s=document.createElement('script');s.src='jspdf.umd.min.js';s.onload=ok;s.onerror=()=>ko(new Error('Non riesco a caricare il generatore di PDF. Controlla la connessione.'));document.head.appendChild(s);});
}
function pdfRange(v){
  const ds=sortedDays(v); if(!ds.length)return'';
  const a=parseDate(ds[0].date),b=parseDate(ds[ds.length-1].date);
  const M=dt=>dt.toLocaleDateString('it-IT',{month:'long'}), g=n=>n===1?'1°':String(n);
  const dal=n=>(n===8||n===11)?"dall'":'dal ', al=n=>(n===8||n===11)?"all'":'al ';
  let s;
  if(+a===+b)s=`il ${g(a.getDate())} ${M(a)} ${a.getFullYear()}`;
  else if(a.getFullYear()!==b.getFullYear())s=`${dal(a.getDate())}${g(a.getDate())} ${M(a)} ${a.getFullYear()} ${al(b.getDate())}${g(b.getDate())} ${M(b)} ${b.getFullYear()}`;
  else if(a.getMonth()!==b.getMonth())s=`${dal(a.getDate())}${g(a.getDate())} ${M(a)} ${al(b.getDate())}${g(b.getDate())} ${M(b)} ${b.getFullYear()}`;
  else s=`${dal(a.getDate())}${g(a.getDate())} ${al(b.getDate())}${g(b.getDate())} ${M(b)} ${b.getFullYear()}`;
  return 'Settimana di visita che va '+s;
}
function pdfTitle(v){const n=[v.sorvegliante,v.conMoglie?v.moglie:''].filter(Boolean);return 'Appuntamenti di servizio con '+(n.length?n.join(' e '):'il sorvegliante di circoscrizione');}
function pdfColumn(d,v,p){ // righe del riquadro di una persona
  const L=[];
  for(const day of sortedDays(v)){
    L.push({t:'day',s:fmtDay(day.date)});
    let n=0;
    v.eventi.filter(e=>e.date===day.date&&e.quando==='G'&&(e.chi||[]).includes(p)).forEach(e=>{L.push({t:'ev',s:`Tutto il giorno: ${evTitle(e)}${e.orario?' ore '+e.orario:''}${e.luogo?' - '+e.luogo:''}`});n++;});
    for(const[k,label]of SLOTS){
      const s=day.slots[k]||{}, ev=v.eventi.filter(e=>e.date===day.date&&e.quando===k&&(e.chi||[]).includes(p));
      ev.forEach(e=>{L.push({t:'ev',s:`${label}: ${evTitle(e)}${e.orario?' ore '+e.orario:''}${e.luogo?' - '+e.luogo:''}`});n++;});
      if(!available(v,day,k,p))continue;
      L.push({t:'slot',s:`${label}${s.orario?' ore '+s.orario:''}${s.luogo?' - '+s.luogo:''}`});n++;
      const list=slotBookings(v,day.date,k,p);
      if(!list.length)L.push({t:'none',s:'nessun appuntamento'});
      list.forEach(b=>{
        const tel=userTel(d,b), mot=(b.motivi||[]).map(motivoName).join(', ');
        L.push({t:'item',s:`${userName(d,b)}${tel?'  tel. '+tel:''}${mot?'  ('+mot+')':''}`});
        (b.studi||[]).forEach(x=>L.push({t:'sub',s:`Studio: ${x.pub}${x.lez?', lezione '+x.lez:''}${x.par?', paragrafo '+x.par:''}`}));
        if(b.note)L.push({t:'sub',s:'Note: '+b.note});
      });
    }
    v.eventi.filter(e=>e.date===day.date&&e.quando==='E'&&(e.chi||[]).includes(p)).forEach(e=>{L.push({t:'ev',s:`Sera: ${evTitle(e)}${e.orario?' ore '+e.orario:''}${e.luogo?' - '+e.luogo:''}`});n++;});
    if(!n)L.push({t:'none',s:'nessun appuntamento'});
  }
  return L;
}
async function makePdf(vid){
  spin(true);

    await loadJsPdf();
    const d=S.data, v=d.visite.find(x=>x.id===(vid||d.attiva)); if(!v)throw new Error('Nessuna visita');
    const {jsPDF}=window.jspdf, doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,H=297,MX=9,MT=10,GAP=5, PT=0.3528;

    // intestazione

    const sub=pdfRange(v)+(d.settings.congregazione?'  -  '+d.settings.congregazione:'');
    doc.text(sub,W/2,MT+tf*PT+7,{align:'center'});
    const top=MT+tf*PT+12, boxH=H-top-MX, boxW=(W-2*MX-GAP*(cols.length-1))/cols.length, HEAD=cols.some(c=>c.tel)?13:9, PAD=2.6;
    // misura e adatta la dimensione del testo perché tutto stia in una pagina
    const style={day:['bold',1.05,COL.ink],slot:['bold',1,COL.pri2],item:['normal',1,COL.ink],sub:['italic',.92,COL.muted],none:['italic',.92,COL.muted],ev:['bolditalic',.95,COL.ev]};
    const indent={day:0,slot:1,item:4,sub:7,none:4,ev:1};
    const before={day:2.2,slot:1.2,item:.3,sub:0,none:.3,ev:1};
    function layout(c,f){ let y=0; const out=[];
      for(const ln of c.lines){const[st,sc]=style[ln.t];doc.setFont('helvetica',st);doc.setFontSize(f*sc);
        const lh=f*sc*PT*1.22, ind=indent[ln.t]*f*.18, wrap=doc.splitTextToSize((ln.t==='item'?'• ':'')+ln.s,boxW-2*PAD-ind);
        y+=before[ln.t]*f*.18; out.push({ln,y,wrap,lh,ind}); y+=lh*wrap.length; }
      return{out,h:y};}
    let f=11, lay;
    for(;f>=4;f-=.25){lay=cols.map(c=>layout(c,f));if(lay.every(l=>l.h<=boxH-HEAD-2*PAD))break;}
    cols.forEach((c,i)=>{
      const x=MX+i*(boxW+GAP);
      doc.setDrawColor(...COL.pri);doc.setLineWidth(.5);doc.roundedRect(x,top,boxW,boxH,2.5,2.5,'S');
      doc.setFillColor(...COL.pri);doc.roundedRect(x,top,boxW,HEAD,2.5,2.5,'F');doc.rect(x,top+HEAD-3,boxW,3,'F');
      doc.setTextColor(255);doc.setFont('helvetica','bold');let hf=11.5;doc.setFontSize(hf);
      while(doc.getTextWidth(c.head)>boxW-2*PAD&&hf>7){hf-=.5;doc.setFontSize(hf);}
      doc.text(c.head,x+PAD,top+(HEAD>9?5.6:HEAD/2+hf*PT*.35));
      if(c.tel){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.text('tel. '+c.tel,x+PAD,top+10.6);}
      const y0=top+HEAD+PAD;
      lay[i].out.forEach(({ln,y,wrap,lh,ind})=>{
        const[st,sc,color]=style[ln.t];
        if(ln.t==='day'){doc.setFillColor(...COL.day);doc.rect(x+.6,y0+y-lh*.15,boxW-1.2,lh*wrap.length+lh*.1,'F');}
        doc.setFont('helvetica',st);doc.setFontSize(f*sc);doc.setTextColor(...color);
        wrap.forEach((w,j)=>doc.text(w,x+PAD+ind,y0+y+lh*j+lh*.72));
      });
    });
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...COL.muted);
    doc.text('Aggiornato al '+new Date().toLocaleString('it-IT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}),W-MX,H-4,{align:'right'});
    const name='appuntamenti-'+(v.nome||'visita').toLowerCase().replace(/[^a-z0-9àèéìòù]+/gi,'-').replace(/^-|-$/g,'')+'.pdf';
    const blob=doc.output('blob'), file=new File([blob],name,{type:'application/pdf'});
    S.pdf={blob,file,name,url:URL.createObjectURL(blob)};
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
    S.sheet={mode:'info'};
    $('#sheet').innerHTML=`<h2>PDF pronto</h2><p class="muted">${esc(name)} · una pagina A4 verticale${f<6?'<br>Il testo è piccolo perché gli appuntamenti sono tanti.':''}</p>
      <a class="btn full" href="${S.pdf.url}" download="${esc(name)}">Scarica il PDF</a>
      ${canShare?'<button class="btn ok full" onclick="sharePdf()">Condividi (WhatsApp, email…)</button>':''}
      <a class="btn sec full" href="${S.pdf.url}" target="_blank" rel="noopener">Apri e stampa</a>
      <button class="btn sec full" onclick="closeSheet()">Chiudi</button>`;
    $('#sheetbg').classList.add('show');
  }catch(e){toast(e.message||String(e),'err');}
  finally{spin(false);}
}

async function saveVisit(){
  const vid=S.data.attiva,val={nome:$('#v_nome').value.trim()||'Visita',sorvegliante:$('#v_sorv').value.trim(),telSorv:$('#v_tels').value.trim(),
    conMoglie:$('#v_cm').checked,moglie:$('#v_mog').value.trim(),telMoglie:$('#v_telm').value.trim(),aperto:$('#v_open').checked,nota:$('#v_nota').value.trim()};
  const cur=V(), valid=validKeys(Object.assign({},cur,val)), lost=cur.bookings.filter(b=>!valid.has(bKey(b)));
  if(lost.length&&!confirm(`${lost.length} prenotazioni con la moglie verranno cancellate. Continuare?`))return;
  if(await mutate('Aggiornata la visita',d=>{const v=d.visite.find(x=>x.id===vid);if(!v)return'Visita non trovata';
    const wasM=v.conMoglie;Object.assign(v,val);
    if(val.conMoglie&&!wasM)v.days.forEach(day=>SLOTS.forEach(([k])=>{const s=day.slots[k];if(s&&s.S?.on&&!(s.M&&s.M.on))s.M={on:true,cap:s.M?.cap??d.settings.capMoglie};}));
    const ok=validKeys(v);v.bookings=v.bookings.filter(b=>ok.has(bKey(b)));}))toast('Salvato ✓');
}
async function newVisit(){
  const nome=$('#n_nome').value.trim(),sorv=$('#n_sorv').value.trim(),mog=$('#n_mog').value.trim(),cp=$('#n_copy')?.checked,start=$('#n_start')?.value;
  if(!nome)return toast('Dai un nome alla nuova visita','err');
  const cur=V();let days=[],eventi=[];
  if(cp){if(!start)return toast('Indica il primo giorno della nuova visita','err');
    const old=sortedDays(cur);if(old.length){const off=Math.round((parseDate(start)-parseDate(old[0].date))/864e5);
      const mv=s=>{const dt=parseDate(s);dt.setDate(dt.getDate()+off);return ymd(dt);};
      days=old.map(x=>({date:mv(x.date),slots:structuredClone(x.slots)}));
      eventi=cur.eventi.map(e=>Object.assign(structuredClone(e),{id:uid(),date:mv(e.date)}));}}
  if(!confirm(`Creare “${nome}” e renderla la visita attiva?${cur?` “${cur.nome}” andrà nello storico.`:''}`))return;
  const id=uid();
  if(await mutate('Nuova visita: '+nome,d=>{const old=V(d);if(old)old.aperto=false;
    d.visite.push({id,nome,sorvegliante:sorv,telSorv:old&&old.sorvegliante===sorv?old.telSorv||'':'',moglie:mog,telMoglie:old&&old.moglie===mog?old.telMoglie||'':'',
      conMoglie:!!mog,aperto:true,nota:'',creata:new Date().toISOString(),days,eventi,bookings:[]});d.attiva=id;})){
    S.evForm=null;S.tab='giorni';render();toast('Nuova visita creata ✓ Ora controlla i giorni');}
}

function downloadCsv(){
  const d=S.data,q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Visita','Sorvegliante','Data','Mezza giornata','Orario','Luogo','Con','Fratello/Sorella','Telefono','Servizio di campo','Visite ulteriori','Studi biblici','Pubblicazione','Lezione','Paragrafo','Note','Prenotato il']];
  d.visite.forEach(v=>[...v.bookings].sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot)).forEach(b=>{
    const s=v.days.find(x=>x.date===b.date)?.slots?.[b.slot]||{},m=b.motivi||[],st=b.studi?.length?b.studi:[{}];
    st.forEach(x=>rows.push([v.nome,v.sorvegliante,b.date,slotName(b.slot),s.orario,s.luogo,b.con==='M'?'Moglie':'Sorvegliante',userName(d,b),userTel(d,b),m.includes('campo')?'sì':'',m.includes('ulteriori')?'sì':'',m.includes('studi')?'sì':'',x.pub,x.lez,x.par,b.note,(b.at||'').slice(0,10)]));}));
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='storico-visite-sorvegliante-'+todayStr()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

async function rekeyAndSave(newKey,salt,token,msg){
  for(let i=0;i<5;i++){
    const rem=await fetchFile(); const data=rem.same?S.data:normalize(await decObj(S.key,rem.file.dati));
    const file={formato:FORMATO,v:1,kdf:{salt:toB64(salt),iter:ITER},dati:await encObj(newKey,data),token:token?await encObj(newKey,token):null,aggiornato:new Date().toISOString()};
    try{S.sha=await putFile(file,rem.sha,msg,token);S.file=file;S.data=data;return;}
    catch(e){if(e.status===409||e.status===422){S.etag=null;await sleep(600);continue;}throw e;}
  }
  throw new Error('Salvataggio non riuscito, riprova.');
}
async function changePw(){
  const o=$('#pw_old').value,n=$('#pw_new').value;
  if(n.length<8)return toast('La nuova password deve avere almeno 8 caratteri','err');
  if(n!==$('#pw_new2').value)return toast('Le due password nuove non coincidono','err');
  spin(true);
  try{
    const kOld=await deriveKey(o,fromB64(S.file.kdf.salt),S.file.kdf.iter);
    try{await decObj(kOld,S.file.dati);}catch{throw new Error('La password attuale non è corretta');}
    const salt=crypto.getRandomValues(new Uint8Array(16)),kNew=await deriveKey(n,salt,ITER);
    await rekeyAndSave(kNew,salt,S.token,'Cambiata la password');
    S.key=kNew; lsSet(LS_PW,n); render(); toast('Password cambiata ✓ Manda ai fratelli il nuovo link di invito');
  }catch(e){toast(e.message,'err');}finally{spin(false);}
}
async function changeToken(){
  const t=$('#tk_new').value.trim();if(!t)return toast('Incolla il nuovo token','err');
  spin(true);
  try{
    const r=await fetch(`https://api.github.com/repos/${S.gh.owner}/${S.gh.repo}`,{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t}});
    if(!r.ok)throw new Error('Token non valido o senza accesso al repository ('+r.status+')');
    const old=S.token; S.token=t; S.etag=null;
    try{await rekeyAndSave(S.key,fromB64(S.file.kdf.salt),t,'Aggiornato il token di salvataggio');}catch(e){S.token=old;throw e;}
    render(); toast('Token aggiornato ✓');
  }catch(e){toast(e.message,'err');}finally{spin(false);}
}

  <button class="btn sm" onclick="doInstall()">Installa</button><button class="x" aria-label="Chiudi" onclick="lsSet('cov_inst_no',1);render()">×</button></div>`;
}
async function doInstall(){
  if(installEvt){installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome!=='accepted')render();return;}
  const pw=lsGet(LS_PW);
  const share='<svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  let h='<h2>Installa l\'app</h2>';
  if(inAppBrowser)h+=`<div class="banner warn">Stai usando il browser interno di un'altra app (per esempio WhatsApp). Apri prima questa pagina in ${isIOS?'<b>Safari</b>':'<b>Chrome</b>'}: tocca il menu ⋯ e scegli “Apri nel browser”.</div>`;
  if(isIOS){
    h+=`<ol class="steps"><li>Apri questa pagina con <b>Safari</b></li><li>Tocca il pulsante <b>Condividi</b> ${share} in basso (o in alto su iPad)</li><li>Scorri e scegli <b>Aggiungi alla schermata Home</b></li><li>Tocca <b>Aggiungi</b></li></ol>`;
    if(pw)h+=`<div class="banner info" style="margin-top:12px">Al primo avvio l'app potrebbe chiederti di nuovo la password della congregazione: è <b>${esc(pw)}</b>. Poi scegli il tuo nome e inserisci il tuo PIN.</div>`;
  }else{
    h+=`<ol class="steps"><li>Apri questa pagina con <b>Chrome</b></li><li>Tocca il menu <b>⋮</b> in alto a destra</li><li>Scegli <b>Installa app</b> (oppure <b>Aggiungi a schermata Home</b>)</li><li>Conferma con <b>Installa</b></li></ol>
    <p class="muted">Su Samsung Internet: menu ☰ → <b>Aggiungi pagina a</b> → <b>Schermata Home</b>.</p>`;
  }
  h+=`<button class="btn sec full" onclick="closeSheet()">Ho capito</button>`;
  S.sheet={mode:'info'}; $('#sheet').innerHTML=h; $('#sheetbg').classList.add('show');
}
window.addEventListener('hashchange',()=>{if(/[#&]p=/.test(location.hash))location.reload();});
boot();
</script>
